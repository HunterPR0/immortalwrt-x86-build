name: Build ImmortalWrt x86_64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget qemu-utils

      - name: Clone ImmortalWrt 24.10.6
        run: git clone --depth 1 -b v24.10.6 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Feeds update & install
        run: |
          cd openwrt
          cp ../configs/feeds.conf feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Extra packages (subconverter luci)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/kenzok8/small-package.git /tmp/smallpkg
          cd /tmp/smallpkg
          git sparse-checkout set luci-app-subconverter
          ls -d luci-app-subconverter/* 2>/dev/null | head
          cp -r luci-app-subconverter "$GITHUB_WORKSPACE/openwrt/package/" || true

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-v24.10.6-${{ hashFiles('configs/packages.list') }}
          restore-keys: dl-

      - name: DIY patches
        run: bash scripts/diy-part2.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Configure
        run: |
          cd openwrt
          cp ../configs/base.config .config
          make defconfig
          while read -r p; do
            case "$p" in ''|\#*) continue;; esac
            ./scripts/config -e "CONFIG_PACKAGE_$p"
          done < ../configs/packages.list
          make defconfig
          echo "===== 缺失包检查 ====="
          : > ../missing.txt
          while read -r p; do
            case "$p" in ''|\#*) continue;; esac
            grep -q "^CONFIG_PACKAGE_$p=y" .config || echo "$p" >> ../missing.txt
          done < ../configs/packages.list
          cat ../missing.txt || true
          echo "===== 目标检查 ====="
          grep -E '^CONFIG_TARGET_(x86|ROOTFS_PARTSIZE|KERNEL_PARTSIZE)' .config

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp openwrt/bin/targets/x86/64/*.img.gz out/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/*.buildinfo out/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/profiles.json out/ 2>/dev/null || true
          cp missing.txt out/ 2>/dev/null || true
          (cd out && sha256sum *.img.gz > sha256sums.txt 2>/dev/null || true)
          ls -lh out

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-images
          path: out/
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          retention-days: 7
