name: Build ImmortalWrt x86_64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget qemu-utils

      - name: Clone ImmortalWrt 24.10.6
        run: git clone --depth 1 -b v24.10.6 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Feeds update & install
        run: |
          cd openwrt
          cp ../configs/feeds.conf feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Extra packages (theme / ddnsto / mosdns)
        run: |
          # aurora 主题：feeds 机制没把它识别成包，直接整仓 clone 进 package/
          git clone --depth 1 https://github.com/eamonxg/luci-theme-aurora.git \
            "$GITHUB_WORKSPACE/openwrt/package/luci-theme-aurora"
          # ddnsto（内网穿透，备用远程入口）：只取两个包，避免 haiibo 大仓库拖慢 feeds
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/haiibo/openwrt-packages.git /tmp/haiibo
          cd /tmp/haiibo
          git sparse-checkout set ddnsto luci-app-ddnsto
          cp -r ddnsto luci-app-ddnsto "$GITHUB_WORKSPACE/openwrt/package/"
          ls "$GITHUB_WORKSPACE/openwrt/package/ddnsto/Makefile"
          # MosDNS v5：本体 + 面板 + geo2txt（依赖），从 sbwml 仓库取 v5 分支
          git clone --depth 1 -b v5 https://github.com/sbwml/luci-app-mosdns.git /tmp/mosdns-pkg
          cp -r /tmp/mosdns-pkg/luci-app-mosdns /tmp/mosdns-pkg/mosdns /tmp/mosdns-pkg/geo2txt \
            "$GITHUB_WORKSPACE/openwrt/package/"
          ls "$GITHUB_WORKSPACE/openwrt/package/mosdns/Makefile"
          ls "$GITHUB_WORKSPACE/openwrt/package/luci-theme-aurora/Makefile"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-v24.10.6-${{ hashFiles('configs/packages.list') }}
          restore-keys: dl-

      - name: DIY patches
        run: bash scripts/diy-part2.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Drop conflicting feed packages
        run: |
          cd openwrt
          # mihomo-alpha 与 mihomo-meta 互相 CONFLICTS + 都 PROVIDES mihomo，会触发 kconfig 递归依赖
          # 只留 mihomo-meta（稳定版），否则 nikki 找不到 mihomo 提供者
          rm -rf package/feeds/nikki/mihomo-alpha || true
          # helloworld 自带的 mihomo 会和 mihomo-meta 抢 PROVIDES，去掉
          rm -rf package/feeds/helloworld/mihomo || true
          ls package/feeds/nikki/ 2>/dev/null || true

      - name: Configure
        run: |
          cd openwrt
          cp ../configs/base.config .config
          make defconfig
          # 追加需要的包，交给 kconfig 自己解析依赖
          while read -r p; do
            case "$p" in ''|\#*) continue;; esac
            echo "CONFIG_PACKAGE_$p=y" >> .config
          done < ../configs/packages.list
          make defconfig
          echo "===== 缺失包检查 ====="
          : > ../missing.txt
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            grep -q "^CONFIG_PACKAGE_$p=y" .config || echo "$p" >> ../missing.txt
          done < ../configs/packages.list
          echo "缺失数量: $(wc -l < ../missing.txt)"
          cat ../missing.txt || true
          echo "===== 期望包核对（必须存在）====="
          drift=0
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "  MISS  $p"; drift=1; }
          done < ../configs/expect.lst

          echo "===== 禁入包核对（必须不存在）====="
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            grep -q "^CONFIG_PACKAGE_$p=y" .config && { echo "  LEAK  $p 仍在配置中"; drift=1; }
            true
          done < ../configs/forbid.lst

          if [ "$drift" = 1 ]; then
            echo "FATAL: 配置偏离预期（expect.lst / forbid.lst），终止编译"
            exit 1
          fi
          echo "核对通过：期望包 $(grep -vcE '^\\s*(#|$)' ../configs/expect.lst) 项齐全，禁入包 $(grep -vcE '^\\s*(#|$)' ../configs/forbid.lst) 项为零"

          echo "===== 互斥包检查 ====="
          if grep -q "^CONFIG_PACKAGE_libustream-mbedtls20201210=y" .config; then
            echo "FATAL: libustream-mbedtls 与 openssl 版会抢 /lib/libustream-ssl.so"
            exit 1
          fi
          grep -E "^CONFIG_PACKAGE_(libustream|dnsmasq|luci-ssl)" .config || true
          echo "===== 目标检查 ====="
          grep -E '^CONFIG_TARGET_(x86|ROOTFS_PARTSIZE|KERNEL_PARTSIZE)' .config || true

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify image manifest
        run: |
          cd openwrt
          mf=$(ls bin/targets/x86/64/*squashfs-combined.manifest 2>/dev/null | head -1)
          [ -z "$mf" ] && mf=$(ls bin/targets/x86/64/*.manifest 2>/dev/null | head -1)
          if [ -z "$mf" ]; then echo "FATAL: 找不到 manifest"; exit 1; fi
          echo "manifest: $mf"
          drift=0
          echo "===== 镜像内容核对：期望包 ====="
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            grep -q "^$p " "$mf" || { echo "  MISS  $p"; drift=1; }
          done < ../configs/expect.lst
          echo "===== 镜像内容核对：禁入包 ====="
          while read -r p; do
            case "$p" in ''|'#'*) continue;; esac
            if grep -q "^$p " "$mf"; then echo "  LEAK  $p"; drift=1; fi
          done < ../configs/forbid.lst
          if [ "$drift" = 1 ]; then echo "FATAL: 镜像内容偏离预期"; exit 1; fi
          echo "镜像核对通过，包总数 $(wc -l < "$mf")"

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          # 只打包实际会用到的两个格式，避免 artifact 膨胀（6 个格式 623MB → 2 个 205MB）
          cp openwrt/bin/targets/x86/64/*generic-squashfs-combined.img.gz out/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/*generic-squashfs-combined-efi.img.gz out/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/*.buildinfo out/ 2>/dev/null || true
          cp openwrt/bin/targets/x86/64/profiles.json out/ 2>/dev/null || true
          cp missing.txt out/ 2>/dev/null || true
          (cd out && sha256sum *.img.gz > sha256sums.txt 2>/dev/null || true)
          ls -lh out

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-images
          path: out/
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          retention-days: 7
